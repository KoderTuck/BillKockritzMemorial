<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Curator Admin — Bill Kockritz Memorial</title>
  <link rel="stylesheet" href="style.css?v=6" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .admin-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
      width: 100%;
    }
    .admin-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .admin-tabs {
      display: flex;
      gap: 8px;
    }
    .admin-tab-btn {
      background: var(--bg-primary);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }
    .admin-tab-btn.active {
      background: var(--accent-gold);
      color: #111;
      border-color: var(--accent-gold);
    }
    .admin-stats-bar {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .admin-stats-bar strong {
      color: var(--text-gold);
    }
    .media-table {
      width: 100%;
      min-width: 1120px;
      border-collapse: collapse;
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      overflow: hidden;
    }
    .media-table-wrap {
      overflow-x: auto;
      border-radius: 10px;
    }
    .media-table th, .media-table td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border-subtle);
    }
    .media-table th {
      background: var(--bg-surface);
      color: var(--text-muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .media-row:hover {
      background: rgba(255, 255, 255, 0.02);
    }
    .admin-thumb {
      width: 60px;
      height: 44px;
      object-fit: cover;
      border-radius: 4px;
      background: #000;
    }
    .admin-thumb-button {
      display: block;
      padding: 0;
      border: 0;
      border-radius: 4px;
      background: transparent;
      cursor: zoom-in;
    }
    .admin-thumb-button:focus-visible {
      outline: 2px solid var(--accent-gold);
      outline-offset: 3px;
    }
    .image-preview-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4vh 4vw;
      background: rgba(0, 0, 0, 0.9);
      cursor: zoom-out;
    }
    .image-preview-modal.hidden {
      display: none;
    }
    .image-preview-modal img {
      max-width: 92vw;
      max-height: 92vh;
      width: auto;
      height: auto;
      object-fit: contain;
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.7);
      cursor: default;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-image { background: rgba(62, 130, 247, 0.2); color: #7cb3ff; }
    .badge-video { background: rgba(226, 183, 104, 0.2); color: var(--text-gold); }
    .badge-finale { background: rgba(255, 75, 75, 0.2); color: #ff8585; }
    .row-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
    }
    .position-input {
      width: 58px;
      padding: 6px 4px;
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      background: var(--bg-primary);
      color: var(--text-main);
      text-align: center;
    }
    .btn-icon {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.15s ease;
    }
    .btn-icon:hover {
      background: var(--border-subtle);
      color: #fff;
    }
    .btn-icon:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .volume-slider-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
    }
    .volume-slider {
      width: 80px;
    }
    .notification-banner {
      background: #1e3a24;
      border: 1px solid #3e8e41;
      color: #bdf5c1;
      padding: 12px 18px;
      border-radius: 8px;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="site-header">
    <div class="header-left">
      <div class="memorial-avatar">
        <span>BK</span>
      </div>
      <div class="memorial-title-wrap">
        <h1>Curator Admin Dashboard</h1>
        <p class="subtitle">Bill Kockritz Memorial Presentations</p>
      </div>
    </div>

    <div class="header-right">
      <a href="index.html" class="btn btn-outline" title="Return to Slideshow">
        <span>◀</span> Back to Presentation
      </a>
      <button id="reset-master-btn" class="btn btn-danger" title="Restore original playlist order">
        <span>🗑️</span> Reset to Master
      </button>
      <button id="save-browser-btn" class="btn btn-primary" title="Save current arrangement in browser">
        <span>💾</span> Save to Browser
      </button>
      <button id="download-media-data-btn" class="btn btn-outline" title="Download the current playlists as media-data.js">
        Download media-data.js
      </button>
    </div>
  </header>

  <main class="admin-container">
    <div id="save-notice" class="notification-banner">
      ✓ Changes saved successfully to browser storage!
    </div>

    <div class="admin-toolbar">
      <div class="admin-tabs">
        <button id="tab-service-btn" class="admin-tab-btn active">⏱️ 7-Min Service Playlist</button>
        <button id="tab-long-btn" class="admin-tab-btn">📽️ Long Show Playlist</button>
      </div>

      <div class="admin-stats-bar">
        <div>Slide Count: <strong id="item-count">0</strong></div>
        <div>
          Pacing: 
          <select id="pacing-select" class="speed-select" style="margin-left:4px;">
            <option value="4500">4.5s</option>
            <option value="5000">5.0s</option>
            <option value="5500" selected>5.5s</option>
            <option value="6000">6.0s</option>
            <option value="7000">7.0s</option>
            <option value="9000">9.0s</option>
          </select>
        </div>
        <div>Est. Runtime: <strong id="runtime-estimate">~0m 00s</strong></div>
      </div>
    </div>

    <div class="media-table-wrap">
      <table class="media-table">
      <thead>
        <tr>
          <th style="width: 70px;">Position</th>
          <th style="width: 80px;">Preview</th>
          <th>Caption / Asset File</th>
          <th style="width: 100px;">Type</th>
          <th style="width: 180px;">Volume / Timing</th>
          <th style="width: 280px; text-align: right;">Order / Action</th>
        </tr>
      </thead>
      <tbody id="media-table-body">
        <!-- Rendered by js/admin.js -->
      </tbody>
      </table>
    </div>
  </main>

  <div id="image-preview-modal" class="image-preview-modal hidden" role="dialog" aria-modal="true" aria-label="Image preview">
    <img id="image-preview-image" alt="" />
  </div>

  <!-- Modular Scripts -->
  <script src="media-data.js"></script>
  <script src="js/config.js"></script>
  <script src="js/media-store.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
