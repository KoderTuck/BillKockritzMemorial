<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Celebrating Bill Kockritz — Faithful Servant & Joyful Heart</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Top Navigation & Controls Header -->
  <header class="site-header">
    <div class="header-left">
      <div class="memorial-avatar">
        <span>BK</span>
      </div>
      <div class="memorial-title-wrap">
        <h1>Bill Kockritz</h1>
        <p class="subtitle">Chief Goofball & Faithful Servant</p>
      </div>
    </div>

    <!-- Mode Selector & Quick Actions -->
    <div class="header-center">
      <div class="mode-toggle-group" role="tablist">
        <button id="mode-presentation-btn" class="mode-btn active" role="tab" aria-selected="true">
          <span class="icon">⏱️</span> 20-Min Service Mode
        </button>
        <button id="mode-archive-btn" class="mode-btn" role="tab" aria-selected="false">
          <span class="icon">🖼️</span> Full Family Archive (<span id="archive-count">0</span>)
        </button>
      </div>
    </div>

    <div class="header-right">
      <button id="billism-btn" class="btn btn-outline" title="A spark of Bill's good-natured humor">
        <span class="icon">💡</span> Billism
      </button>
      <button id="music-drawer-toggle" class="btn btn-primary">
        <span class="icon">🎵</span> Music Playlist
      </button>
    </div>
  </header>

  <!-- Slide Presentation Stage -->
  <main id="presentation-view" class="presentation-container">
    <div class="theater-stage" id="theater-stage">
      
      <!-- Slide Viewport -->
      <div class="slide-viewport" id="slide-viewport">
        <!-- Rendered dynamically by app.js -->
        <div id="media-slot" class="media-slot"></div>
        <div id="slide-caption-overlay" class="slide-caption-overlay">
          <p id="slide-caption-text"></p>
        </div>
      </div>

      <!-- Playback Controls Bar -->
      <div class="playback-bar">
        <div class="playback-left">
          <button id="prev-btn" class="ctrl-btn" title="Previous (Left Arrow)">◀</button>
          <button id="play-pause-btn" class="ctrl-btn" title="Play / Pause (Spacebar)">❚❚</button>
          <button id="next-btn" class="ctrl-btn" title="Next (Right Arrow)">▶</button>
          <span id="slide-counter" class="counter-display">1 / 160</span>
        </div>

        <div class="playback-center">
          <div class="progress-track" id="progress-track">
            <div class="progress-bar" id="progress-bar"></div>
          </div>
        </div>

        <div class="playback-right">
          <label for="speed-select" class="speed-label">Pacing:</label>
          <select id="speed-select" class="speed-select">
            <option value="4500">4.5s</option>
            <option value="5500" selected>5.5s (Service)</option>
            <option value="7500">7.5s</option>
            <option value="10000">10s</option>
          </select>
          <button id="fullscreen-btn" class="ctrl-btn" title="Toggle Fullscreen">⛶</button>
        </div>
